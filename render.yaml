services:
  - type: web
    name: sebn-ia-service
    env: python
    rootDir: ia-service
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free

  - type: web
    name: sebn-web-app
    env: docker
    rootDir: SebnWeb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /Index
    plan: starter
    disk:
      name: sebn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SEBN_DATA_DIR
        value: /var/data
      - key: DetectionApi__BaseUrl
        value: https://sebn-ia-service.onrender.com
