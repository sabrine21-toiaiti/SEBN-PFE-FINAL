services:
  - type: web
    name: sebn-pfe-ia
    env: python
    rootDir: ia-service
    buildCommand: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free

  - type: web
    name: sebn-pfe-web
    env: docker
    rootDir: SebnWeb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /Index
    plan: free
    envVars:
      - key: DetectionApi__BaseUrl
        value: https://sebn-pfe-ia.onrender.com
